      .then(function (k) { return S.deriveBits({ name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" }, k, 384) })
      .then(function (bits) { bits = new Uint8Array(bits); return S.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]).then(function (k) { return S.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, k, body) }) })
      .then(function (b) { var s = new TextDecoder().decode(b); if (s.indexOf("halden:") !== 0) throw new Error("wrong"); return s.slice(7) });
  }
  function open(pw, keep) {
    return unlock(document.getElementById("blob").textContent, pw).then(function (html) {
      try { sessionStorage.setItem("halden-pw", pw); if (keep) localStorage.setItem("halden-pw", pw) } catch (e) {}
      document.open(); document.write(html); document.close();
    });
  }
  var saved = null; try { saved = localStorage.getItem("halden-pw") } catch (e) {}
  if (saved) open(saved, true).catch(function () { try { localStorage.removeItem("halden-pw") } catch (e) {} });
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value.trim().toLowerCase();
    document.getElementById("err").textContent = "";
    open(pw, document.getElementById("keep").checked).catch(function () { document.getElementById("err").textContent = "That's not it." });
  });
})();
</script>
